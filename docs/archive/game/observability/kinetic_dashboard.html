/* ---------- color helpers ---------- */
const C = getComputedStyle(document.documentElement);
const col = n => C.getPropertyValue(n).trim();
function heat(t){ // 0..1 blue->green->amber->red
  t=Math.max(0,Math.min(1,t));
  const stops=[[0,[76,125,255]],[0.4,[57,217,138]],[0.7,[255,180,84]],[1,[255,92,108]]];
  for(let i=0;i<stops.length-1;i++){const[a,ca]=stops[i],[b,cb]=stops[i+1];if(t>=a&&t<=b){const k=(t-a)/(b-a);return`rgb(${ca.map((c,j)=>Math.round(c+(cb[j]-c)*k)).join(',')})`;}}
  return'rgb(255,92,108)';
}
const matColor = m => m==='diamond'?col('--cyan'):m==='glass'?col('--amber'):col('--blue');

/* ---------- ① THE SEAM (Three.js) ---------- */
const seamCanvas=document.getElementById('seam');
let renderer,scene,cam,boxes=[],GN=7;
function initSeam(){
  renderer=new THREE.WebGLRenderer({canvas:seamCanvas,antialias:true,alpha:true});
  scene=new THREE.Scene();
  cam=new THREE.PerspectiveCamera(42,1,0.1,100);
  cam.position.set(0,0,11); cam.lookAt(0,0,0);
  const g=new THREE.BoxGeometry(0.82,0.82,0.82);
  for(let y=0;y<GN;y++)for(let x=0;x<GN;x++){
    const m=new THREE.MeshBasicMaterial({color:0x39d98a});
    const b=new THREE.Mesh(g,m);
    b.userData={x:x-(GN-1)/2,y:y-(GN-1)/2};
    scene.add(b); boxes.push(b);
  }
  resizeSeam();
}
function resizeSeam(){
  const w=seamCanvas.clientWidth,h=seamCanvas.clientHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
}
function renderSeam(fr){
  const Wi=fr.Wi, shear=Wi*0.9, hc=Wi/0.85;
  const c=heat(hc);
  const rgb=c.match(/\d+/g).map(Number);
  const three=new THREE.Color(`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`);
  for(const b of boxes){
    const ux=b.userData.x,uy=b.userData.y;
    b.position.set(ux*1.05 + shear*uy, uy*1.05, 0);  // simple shear x += s*y
    b.rotation.z = shear*0.18;
    b.material.color.copy(three);
    b.scale.setScalar(fr.event==='melted'?1.12:1.0);
  }
  scene.rotation.y=Math.sin(performance.now()/3000)*0.12;
  renderer.render(scene,cam);
}

function setup2d(id){
  const cv=document.getElementById(id),ctx=cv.getContext('2d');
  function r(){const dpr=devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  r(); return {cv,ctx,resize:r};
}
const Y=setup2d('yield'), L=setup2d('lineage'), R=setup2d('truth');

/* ---------- ② THE YIELD ---------- */
function renderYield(fr){
  const {ctx,cv}=Y,W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  const cx=W*0.5,cy=H*0.66,rad=Math.min(W,H)*0.30;
  // arc track
  ctx.lineWidth=15;ctx.lineCap='round';
  ctx.strokeStyle=col('--line');
  ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI,2*Math.PI);ctx.stroke();
  // integrity fill
  const integ=fr.integrity, ang=Math.PI+Math.PI*integ;
  ctx.strokeStyle = fr.admit?col('--green'):col('--red');
  ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI,ang);ctx.stroke();
  // firewall mark at integrity where dS=0  (integ0 = (0+9.1)/31.1)
  const fw=(0+9.1)/31.1, fa=Math.PI+Math.PI*fw;
  ctx.strokeStyle=col('--red');ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx+Math.cos(fa)*(rad-12),cy+Math.sin(fa)*(rad-12));ctx.lineTo(cx+Math.cos(fa)*(rad+12),cy+Math.sin(fa)*(rad+12));ctx.stroke();
  // center text
  ctx.textAlign='center';
  ctx.fillStyle=col('--txt');ctx.font='600 30px '+col('--mono');
  ctx.fillText('ΔS '+(fr.dS>=0?'+':'')+fr.dS.toFixed(1),cx,cy-6);
  ctx.fillStyle=fr.admit?col('--green'):col('--red');ctx.font='12px '+col('--mono');
  ctx.fillText(fr.admit?'CITADEL ADMITS':(fr.event==='unsurvivable'?'FIREWALL HOLDS · REJECT':'BREACH'),cx,cy+14);
  // chi compliance bar
  const bx=W*0.16,bw=W*0.68,by=H*0.84;
  ctx.fillStyle=col('--line');ctx.fillRect(bx,by,bw,8);
  ctx.fillStyle=matColor(fr.material);ctx.fillRect(bx,by,bw*fr.chi,8);
  // chi_required marker
  if(fr.chi_required!==null && fr.chi_required<=1){
    const mx=bx+bw*fr.chi_required;
    ctx.strokeStyle=col('--amber');ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(mx,by-5);ctx.lineTo(mx,by+13);ctx.stroke();
    ctx.fillStyle=col('--amber');ctx.font='9px '+col('--mono');ctx.textAlign='center';
    ctx.fillText('χ_req '+fr.chi_required.toFixed(2),mx,by-9);
  }
  ctx.fillStyle=col('--txt2');ctx.font='10px '+col('--mono');ctx.textAlign='left';
  ctx.fillText('χ '+fr.chi.toFixed(2)+'  ('+fr.material+')',bx,by+24);
  ctx.textAlign='right';
  ctx.fillStyle = fr.Wi>fr.Wi_crit?col('--red'):col('--txt2');
  ctx.fillText('Wi '+fr.Wi.toFixed(2)+' / crit '+fr.Wi_crit,bx+bw,by+24);
  document.getElementById('yieldTag').textContent = fr.event==='melted'?'◆ MELT':'';
}

/* ---------- ③ THE LINEAGE ---------- */
function renderLineage(fr){
  const {ctx,cv}=L,W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  const done=T.filter(t=>t.frame<=fr.i);
  const n=done.length, total=T.length;
  const x0=W*0.08,x1=W*0.92,y=H*0.52,step=(x1-x0)/Math.max(total,1);
  // seed node
  ctx.fillStyle=col('--cyan');ctx.beginPath();ctx.arc(x0,y,6,0,7);ctx.fill();
  ctx.fillStyle=col('--txt3');ctx.font='9px '+col('--mono');ctx.textAlign='center';
  ctx.fillText('seed',x0,y+22);
  let px=x0;
  done.forEach((t,k)=>{
    const x=x0+step*(k+1);
    const c = t.chi_after<0.25?col('--cyan'):t.chi_after<0.7?col('--amber'):col('--blue');
    ctx.strokeStyle=col('--line');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(x,y);ctx.stroke();
    const cur=(k===n-1);
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,cur?7:4.5,0,7);ctx.fill();
    if(cur){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.stroke();
      ctx.fillStyle=col('--txt2');ctx.font='9px '+col('--mono');
      ctx.fillText('χ '+t.chi_after.toFixed(2),x,y-16);
      ctx.fillStyle=col('--txt3');ctx.fillText(t.H_after.slice(0,8),x,y+22);}
    px=x;
  });
  ctx.fillStyle=col('--txt2');ctx.font='10px '+col('--mono');ctx.textAlign='left';
  ctx.fillText('transitions: '+n+' / '+total,x0,H*0.86);
  ctx.textAlign='right';ctx.fillStyle=col('--txt3');
  ctx.fillText('content-addressed · append-only',x1,H*0.86);
}

/* ---------- ④ THE TRUTH ---------- */
let ghostTrail=[];
function renderTruth(fr){
  const {ctx,cv}=R,W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  // H_t ticker
  ctx.textAlign='left';ctx.fillStyle=col('--txt3');ctx.font='10px '+col('--mono');
  ctx.fillText('H_t  (bit-perfect, advances every transition)',W*0.06,H*0.20);
  ctx.fillStyle=col('--green');ctx.font='600 22px '+col('--mono');
  ctx.fillText(fr.H,W*0.06,H*0.32);
  // memory vs history bars
  const bx=W*0.06,bw=W*0.40,y1=H*0.50,y2=H*0.66;
  const maxHist=TELE.frames;
  ctx.fillStyle=col('--txt3');ctx.font='10px '+col('--mono');
  ctx.fillText('LIVE WORKING SET (bounded)',bx,y1-8);
  ctx.fillStyle=col('--line');ctx.fillRect(bx,y1,bw,9);
  ctx.fillStyle=col('--green');ctx.fillRect(bx,y1,bw*(fr.working_set/8),9);
  ctx.fillStyle=col('--txt2');ctx.textAlign='right';ctx.fillText(fr.working_set+' claim',bx+bw,y1-8);ctx.textAlign='left';
  ctx.fillStyle=col('--txt3');ctx.fillText('AUDITABLE HISTORY (unbounded DAG)',bx,y2-8);
  ctx.fillStyle=col('--line');ctx.fillRect(bx,y2,bw,9);
  ctx.fillStyle=col('--violet');ctx.fillRect(bx,y2,bw*(fr.history/Math.max(maxHist*0.35,1)),9);
  ctx.fillStyle=col('--txt2');ctx.textAlign='right';ctx.fillText(fr.history+' txns',bx+bw,y2-8);ctx.textAlign='left';
  // ghost spike sparkline (injection footprint dZ)
  ghostTrail.push(fr.ghost); if(ghostTrail.length>W) ghostTrail.shift();
  const gx=W*0.52,gw=W*0.42,gy=H*0.52,gh=H*0.20;
  ctx.fillStyle=col('--txt3');ctx.fillText('‖ghost‖ injection footprint (dZ)',gx,gy-8);
  ctx.strokeStyle=col('--red');ctx.lineWidth=1.5;ctx.beginPath();
  const start=Math.max(0,fr.i-60);
  for(let k=start;k<=fr.i;k++){const v=F[k].ghost;const xx=gx+gw*((k-start)/60);const yy=gy+gh-(v/0.95)*gh;k===start?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy);}
  ctx.stroke();
  // numerics
  ctx.fillStyle=col('--txt2');ctx.font='11px '+col('--mono');ctx.textAlign='left';
  ctx.fillText('η_CLT '+fr.eta_CLT.toFixed(3)+'   ESS — pure   t='+fr.i,W*0.06,H*0.92);
}

/* ---------- playback ---------- */
let idx=0, playing=false, last=0;
const scrub=document.getElementById('scrub'); scrub.max=F.length-1;
const flash=document.getElementById('flash');
function show(i){
  idx=Math.max(0,Math.min(F.length-1,i));
  const fr=F[idx];
  renderSeam(fr); renderYield(fr); renderLineage(fr); renderTruth(fr);
  scrub.value=idx;
  document.getElementById('seamTag').textContent='Wi '+fr.Wi.toFixed(2);
  document.getElementById('lineTag').textContent=fr.material.toUpperCase();
  document.getElementById('truthTag').textContent='t='+fr.i;
  const ev=document.getElementById('evt');
  if(fr.event==='melted'){ev.textContent='◆ PHASE CHANGE';ev.style.background='#2a2034';ev.style.color=col('--amber');
    flash.style.opacity=0.5;setTimeout(()=>flash.style.opacity=0,90);}
  else if(fr.event==='unsurvivable'){ev.textContent='■ FIREWALL HOLDS';ev.style.background='#33161a';ev.style.color=col('--red');}
  else{ev.textContent='shearing';ev.style.background='transparent';ev.style.color=col('--txt3');}
  document.getElementById('clock').textContent=`frame ${fr.i+1}/${F.length} · ${fr.material}`;
}
function loop(ts){
  if(playing){ if(ts-last>90){ last=ts; if(idx>=F.length-1){playing=false;document.getElementById('play').textContent='▶ Play';} else show(idx+1);} }
  else renderSeam(F[idx]); // keep 3D idle-rotating
  requestAnimationFrame(loop);
}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'❚❚ Pause':'▶ Play';if(playing&&idx>=F.length-1)show(0);};
document.getElementById('reset').onclick=()=>{playing=false;document.getElementById('play').textContent='▶ Play';ghostTrail=[];show(0);};
scrub.oninput=e=>{playing=false;document.getElementById('play').textContent='▶ Play';show(+e.target.value);};
addEventListener('resize',()=>{resizeSeam();Y.resize();L.resize();R.resize();show(idx);});
initSeam(); show(0); requestAnimationFrame(loop);
</script>
